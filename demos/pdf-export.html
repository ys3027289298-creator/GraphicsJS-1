<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>GraphicsJS local PDF export demo</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    #stage { width: 600px; height: 400px; border: 1px solid #ccc; }
    button { padding: 8px 16px; margin: 12px 8px 0 0; font-size: 14px; }
    pre { background: #f5f5f5; padding: 12px; max-width: 600px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>本地 PDF 导出示例（真文本 + 矢量 + 透明度 + 渐变）</h3>
  <div id="stage"></div>
  <button id="export">导出 PDF（本地，不联网）</button>
  <button id="inspect">查看降级/诊断信息</button>
  <pre id="out"></pre>

  <!-- Closure base + deps (the new src/pdf modules are registered in deps.js) -->
  <script src="../contrib/closure-library/closure/goog/base.js"></script>
  <script src="../src/deps.js"></script>
  <script>
    goog.require('acgraphentry');
    goog.require('acgraph.pdf.stagePdf');
  </script>
  <script>
    // In a real page, fetch the TTF and register it before exporting.
    async function ensureFont() {
      var res = await fetch('../artifacts/fonts/wqy-zenhei.ttf');
      var buf = new Uint8Array(await res.arrayBuffer());
      acgraph.pdf.registerFont('WenQuanYi Zen Hei', buf);
    }

    var stage = acgraph.create('stage');
    stage.resize(600, 400);
    var layer = stage.layer();
    layer.rect(40, 110, 150, 90).fill('#1f77b4', 0.6).stroke('#333', 2.5);
    layer.rect(100, 140, 150, 90).fill('#d62728', 0.45);
    layer.circle(320, 150, 55).fill('#2ca02c', 0.3).stroke('#2ca02c', 3, 0.8);
    layer.path().moveTo(420, 200).lineTo(500, 200).lineTo(460, 120).close()
      .fill('#ff7f0e').stroke('#9467bd', 2);
    layer.path().moveTo(40, 260).curveTo(120, 240, 200, 300, 300, 270)
      .stroke('#444', 2, '6 4');
    var t1 = stage.text();
    t1.x(40).y(40).text('销售报告 Sales Report 2026').fontSize(20);
    var t2 = stage.text();
    t2.x(40).y(80).text('Q4 营收 Revenue ¥1,250,000（含税）').fontSize(14);
    var t3 = stage.text();
    t3.x(40).y(375).text('环比增长率 Growth: +12.5%').fontSize(12);

    document.getElementById('export').onclick = async function () {
      await ensureFont();
      var doc = stage.toPdfDocument({ width: 600, height: 400, title: 'PDF export demo' });
      stage.constructor; // no-op
      // Download via the convenience API.
      stage.saveAsPdfLocal({ filename: 'graphicsjs-local.pdf' });
      document.getElementById('out').textContent =
        'PDF 字节: ' + doc.bytes.length + '\n警告: ' + JSON.stringify(doc.warnings) +
        '\n提取文本: ' + JSON.stringify(doc.extractedText);
    };
    document.getElementById('inspect').onclick = async function () {
      await ensureFont();
      var doc = stage.toPdfDocument({ width: 600, height: 400 });
      document.getElementById('out').textContent = JSON.stringify(doc.diagnostics, null, 2);
    };
  </script>
</body>
</html>
