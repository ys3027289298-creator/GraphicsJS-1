<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GraphicsJS Heatmap Demo</title>
  <style>
    body { font-family: Verdana, sans-serif; margin: 24px; color: #222; }
    h2 { margin: 24px 0 8px; font-size: 15px; }
    .panel { display: inline-block; vertical-align: top; margin-right: 32px; }
    .legend { display: inline-block; width: 16px; height: 16px; margin-right: 6px;
              vertical-align: middle; border: 1px solid #ccc; }
    button { padding: 6px 12px; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Heatmap add-on for GraphicsJS</h1>
  <p>
    <button id="zoomOut">Zoom 1x</button>
    <button id="zoomIn">Zoom 2x</button>
    <button id="empty">Empty data</button>
    <button id="zeros">All-zero data</button>
    <button id="reset">Sample data</button>
  </p>
  <div class="panel">
    <h2>Before: scatter only</h2>
    <div id="scatter"></div>
  </div>
  <div class="panel">
    <h2>After: grid-aggregated heatmap</h2>
    <div id="heatmap"></div>
    <p>
      <span class="legend" style="background:#08306b"></span>domain min
      <span class="legend" style="background:#f7fbff"></span>mid
      <span class="legend" style="background:#7f0000"></span>domain max
      <span class="legend" style="background:#e8e8e8"></span>empty cell
      <span class="legend" style="background:#f5f5f5"></span>no data
    </p>
  </div>

  <script src="../../dist/graphics.js"></script>
  <script src="../../src/heatmap/colorScale.js"></script>
  <script src="../../src/heatmap/grid.js"></script>
  <script src="../../src/heatmap/renderer.js"></script>
  <script src="demo.js"></script>
</body>
</html>
